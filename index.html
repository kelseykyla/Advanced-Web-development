<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Study Pod Booking Widget</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9fc;
      color: #2b2d42;
      margin: 40px auto;
      max-width: 800px;
      padding: 0 20px;
    }

    h1, h2 {
      color: #1d3557;
      text-align: center;
      margin-top: 20px;
    }

    label {
      display: block;
      margin: 14px 0 6px;
      font-weight: bold;
      color: #264653;
    }

    select, input[type="time"], input[type="text"] {
      padding: 10px;
      font-size: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      box-sizing: border-box;
      background-color: #ffffff;
      transition: border 0.2s ease;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #00b4d8;
    }

    button {
      background: linear-gradient(to right, #00b4d8, #0077b6);
      color: #fff;
      font-size: 15px;
      padding: 10px 16px;
      margin-top: 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button:hover {
      background: linear-gradient(to right, #023e8a, #0077b6);
    }

    #errors {
      margin-top: 10px;
      background-color: #ffe8e8;
      color: #d00000;
      padding: 10px;
      border-radius: 5px;
      font-weight: 500;
    }

    table {
      width: 100%;
      margin-top: 25px;
      border-collapse: collapse;
      background-color: #ffffff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
      text-align: left;
    }

    th {
      background-color: #caf0f8;
      color: #03045e;
      font-weight: bold;
    }

    td button.removeBtn {
      background: #e63946;
      color: white;
      border: none;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    td button.removeBtn:hover {
      background: #b02434;
    }

    .insight-box {
      margin-top: 30px;
      padding: 20px;
      background: #e3f2fd;
      border-left: 5px solid #00b4d8;
      border-radius: 8px;
    }

    .insight-box div {
      font-size: 15px;
      margin-bottom: 6px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <h1>Study Pod Booking Widget</h1>

  <form id="bookingForm">
    <label for="podSelect">Select Pod:</label>
    <select id="podSelect"></select>

    <label for="timeInput">Time (HH:MM):</label>
    <input type="time" id="timeInput" step="3600" />

    <label for="studentIds">Student IDs (comma-separated):</label>
    <input type="text" id="studentIds" placeholder="e.g., SIT-001,SIT-045" />

    <button type="submit">Book</button>
    <div id="errors"></div>
  </form>

  <h2>All Bookings</h2>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Pod</th>
        <th>Time</th>
        <th># Students</th>
        <th>Student IDs</th>
        <th>Actions</th>
      </tr>
    </thead>
