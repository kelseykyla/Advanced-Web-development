<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Study Pod Booking Widget</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h1, h2 {
      color: #00274d;
    }
    label {
      display: block;
      margin: 10px 0 5px;
    }
    select, input[type="time"], input[type="text"], button {
      margin-bottom: 10px;
      padding: 6px;
      width: 100%;
      max-width: 300px;
    }
    #errors {
      color: red;
      margin-bottom: 10px;
    }
    table, th, td {
      border: 1px solid #ccc;
      border-collapse: collapse;
      padding: 6px;
    }
    table {
      width: 100%;
      margin-top: 20px;
    }
    .insight-box {
      margin-top: 20px;
      background: #f2f2f2;
      padding: 10px;
    }
    #undoBtn {
      background-color: #ccc;
      border: none;
      padding: 6px 12px;
      cursor: pointer;
    }
    #undoBtn:hover {
      background-color: #bbb;
    }
  </style>
</head>
<body>
  <h1>Study Pod Booking Widget</h1>

  <form id="bookingForm">
    <label for="podSelect">Select Pod:</label>
    <select id="podSelect"></select>

    <label for="timeInput">Time (HH:MM):</label>
    <input type="time" id="timeInput" step="3600" />

    <label for="studentIds">Student IDs (comma-separated):</label>
    <input type="text" id="studentIds" placeholder="e.g., SIT-001,SIT-045" />

    <button type="submit">Book</button>
    <button type="button" id="undoBtn">Undo Last Booking</button>

    <div id="errors"></div>
  </form>

  <h2>All Bookings</h2>
  <table>
    <thead>
      <tr>
        <th>#</th>
        <th>Pod</th>
        <th>Time</th>
        <th># Students</th>
        <th>Student IDs</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="bookingTable"></tbody>
  </table>

  <div class="insight-box">
    <h2>Insights</h2>
    <div id="insights"></div>
  </div>

  <script>
    /*
      JS Features Used:
      - Variables & Data Types: let, const, arrays, strings, numbers, stack
      - Control Structures: if/else logic for validation and rule enforcement
      - Loops: for, for...of used in rendering and insight computation
      - Functions: clean single-purpose helpers for validation, rendering, logic
      - Events: form submission, undo click, remove booking delegation
      - DOM Manipulation: createElement, appendChild, textContent, innerHTML
    */

    const pods = [
      { id: "POD-A", capacity: 4 },
      { id: "POD-B", capacity: 4 },
      { id: "POD-C", capacity: 4 }
    ];

    const initialBookings = [
      { podId: "POD-A", time: "09:00", students: ["SIT-001", "SIT-045"] },
      { podId: "POD-B", time: "10:00", students: ["SMC-210"] }
    ];

    let bookings = [...initialBookings];
    let bookingHistoryStack = []; // <-- New: stack to track undo history
    let duplicateAttempts = 0;

    const podSelect = document.getElementById("podSelect");
    const form = document.getElementById("bookingForm");
    const undoBtn = document.getElementById("undoBtn");
    const errorsDiv = document.getElementById("errors");
    const bookingTable = document.getElementById("bookingTable");
    const insightsDiv = document.getElementById("insights");

    for (let pod of pods) {
      const option = document.createElement("option");
      option.value = pod.id;
      option.textContent = pod.id;
      podSelect.appendChild(option);
    }

    function parseStudentIds(input) {
      return input
        .split(",")
        .map(id => id.trim().toUpperCase())
        .filter(id => id);
    }

    function isWithinOperatingHours(time) {
      return time >= "08:00" && time < "20:00"; // Strict === comparisons are enforced
    }

    function findBooking(podId, time) {
      for (let booking of bookings) {
        if (booking.podId === podId && booking.time === time) {
          return booking;
        }
      }
      return null;
    }

    function hasCrossPodClash(studentId, time, podId) {
      for (let booking of bookings) {
        if (booking.time === time && booking.podId !== podId && booking.students.includes(studentId)) {
          return true;
        }
      }
      return false;
    }

    function roundTo1Decimal(value) {
      return Math.round(value * 10) / 10;
    }

    function renderBookings() {
      bookingTable.innerHTML = "";
      for (let i = 0; i < bookings.length; i++) {
        const booking = bookings[i];
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${i + 1}</td>
          <td>${booking.podId}</td>
          <td>${booking.time}</td>
          <td>${booking.students.length}</td>
          <td>${booking.students.join(", ")}</td>
          <td><button data-index="${i}" class="removeBtn">Remove</button></td>
        `;
        bookingTable.appendChild(row);
      }
      recomputeInsights();
    }

    function recomputeInsights() {
      let totalBookings = bookings.length;
      let studentList = [];
      let hourCounts = {};
      let podUsage = {};
      let podSeats = {};

      for (let pod of pods) {
        podUsage[pod.id] = {};
        podSeats[pod.id] = 0;
      }

      for (let booking of bookings) {
        for (let student of booking.students) {
          if (!studentList.includes(student)) {
            studentList.push(student);
          }
        }
        hourCounts[booking.time] = (hourCounts[booking.time] || 0) + booking.students.length;
        podUsage[booking.podId][booking.time] = true;
        podSeats[booking.podId] += booking.students.length;
      }

      let busiestHour = null;
      let maxStudents = 0;
      for (let time in hourCounts) {
        if (hourCounts[time] > maxStudents) {
          maxStudents = hourCounts[time];
          busiestHour = time;
        }
      }

      let fillRates = "";
      for (let pod of pods) {
        let usedSlots = Object.keys(podUsage[pod.id]).length;
        let maxSeats = usedSlots * pod.capacity;
        let rate = maxSeats > 0 ? (podSeats[pod.id] / maxSeats) * 100 : 0;
        fillRates += `<div>${pod.id}: ${roundTo1Decimal(rate)}%</div>`;
      }

      insightsDiv.innerHTML = `
        <div>Total bookings today: ${totalBookings}</div>
        <div>Total unique students: ${studentList.length}</div>
        <div>Busiest hour: ${busiestHour || "N/A"}</div>
        <div>Fill-rate per pod: ${fillRates}</div>
        <div>Duplicate attempts blocked: ${duplicateAttempts}</div>
      `;
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      errorsDiv.textContent = "";

      const podId = podSelect.value;
      const time = document.getElementById("timeInput").value;
      const studentsInput = document.getElementById("studentIds").value;
      const students = parseStudentIds(studentsInput);

      if (!podId || !time || students.length === 0) {
        errorsDiv.textContent = "Please fill all fields correctly.";
        return;
      }

      if (!isWithinOperatingHours(time)) {
        errorsDiv.textContent = "Time must be between 08:00 and before 20:00.";
        return;
      }

      const existingBooking = findBooking(podId, time);
      const allStudents = existingBooking ? existingBooking.students.slice() : [];

      for (let student of students) {
        if (allStudents.includes(student)) {
          duplicateAttempts++;
          errorsDiv.textContent = `Student ${student} already booked in this pod and hour.`;
          return;
        }
        if (hasCrossPodClash(student, time, podId)) {
          duplicateAttempts++;
          errorsDiv.textContent = `Student ${student} is already booked in another pod at the same time.`;
          return;
        }
      }

      // All checks passed, save booking to history stack
      const newBooking = { podId, time, students: [...students] };
      bookingHistoryStack.push(newBooking);

      if (existingBooking) {
        existingBooking.students.push(...students);
      } else {
        bookings.push(newBooking);
      }

      document.getElementById("studentIds").value = "";
      document.getElementById("studentIds").focus();
      errorsDiv.textContent = "";
      renderBookings();
    });

    // Remove individual booking via event delegation
    bookingTable.addEventListener("click", function (e) {
      if (e.target.classList.contains("removeBtn")) {
        const index = parseInt(e.target.dataset.index);
        bookings.splice(index, 1);
        renderBookings();
      }
    });

    // Undo last booking
    undoBtn.addEventListener("click", function () {
      if (bookingHistoryStack.length > 0) {
        const lastBooking = bookingHistoryStack.pop();
        // Remove the exact booking from the bookings array
        for (let i = bookings.length - 1; i >= 0; i--) {
          if (
            bookings[i].podId === lastBooking.podId &&
            bookings[i].time === lastBooking.time &&
            JSON.stringify(bookings[i].students) === JSON.stringify(lastBooking.students)
          ) {
            bookings.splice(i, 1);
            break;
          }
        }
        renderBookings();
      } else {
        errorsDiv.textContent = "Nothing to undo.";
      }
    });

    renderBookings();
  </script>
</body>
</html>
